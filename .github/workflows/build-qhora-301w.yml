name: Build QNAP QHora-301W iStoreOS Firmware

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      upload_release:
        description: 'Upload to GitHub Release'
        required: false
        default: 'true'
  push:
    branches:
      - 'qhora-301w*'
    paths:
      - 'qhora-301w.config'
      - '.github/workflows/build-qhora-301w.yml'

permissions:
  contents: write

env:
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: qhora-301w.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        sudo docker image prune --all --force 2>/dev/null || true
        df -h

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build psmisc qemu-utils rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd u-boot-tools binwalk
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Load Custom Feeds (diy-part1.sh)
      run: |
        [ -e "$FEEDS_CONF" ] && [ "$FEEDS_CONF" != "feeds.conf.default" ] && cp -f "$FEEDS_CONF" feeds.conf.default
        chmod +x "$DIY_P1_SH"
        ./"$DIY_P1_SH"

    - name: Update & Install Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration (diy-part2.sh & config)
      run: |
        [ -e files ] && mv files package/base-files/files
        [ -e "$CONFIG_FILE" ] && cp -f "$CONFIG_FILE" .config
        chmod +x "$DIY_P2_SH"
        ./"$DIY_P2_SH"
        make defconfig

    - name: Download Package Dependencies
      id: package
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the Firmware
      id: compile
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check Space Usage
      if: steps.compile.outputs.status == 'success'
      run: df -hT

    - name: Organize Firmware Files & Extract Partitions
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        cd bin/targets/*/*
        rm -rf packages
        
        # 针对 QHora-301W 自动提取 kernel 与 rootfs 镜像，方便底层 dd 刷机
        SYSUPGRADE_IMG=$(ls *qnap_301w*sysupgrade.bin 2>/dev/null | head -n 1)
        if [ -n "$SYSUPGRADE_IMG" ]; then
          echo "Found sysupgrade image: $SYSUPGRADE_IMG"
          mkdir -p extracted
          tar -xf "$SYSUPGRADE_IMG" -C extracted 2>/dev/null || binwalk -e "$SYSUPGRADE_IMG" -C extracted || true
          if [ -f extracted/sysupgrade-qnap_301w/kernel ]; then
            cp extracted/sysupgrade-qnap_301w/kernel ./qhora_301w_kernel.bin
            cp extracted/sysupgrade-qnap_301w/root ./qhora_301w_rootfs.bin
          elif [ -f extracted/kernel ]; then
            cp extracted/kernel ./qhora_301w_kernel.bin
            cp extracted/root ./qhora_301w_rootfs.bin
          fi
          rm -rf extracted
        fi
        
        # 生成 sha256 校验码
        sha256sum *.* > sha256sums.txt
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware Directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: iStoreOS_QHora301W${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate Release Tag
      id: tag
      if: steps.organize.outputs.status == 'success' && (inputs.upload_release == 'true' || env.UPLOAD_RELEASE == 'true')
      run: |
        echo "release_tag=QHora-301W-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "release_date=$(date +"%Y-%m-%d %H:%M")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && env.FIRMWARE != ''
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: iStoreOS 24.10 for QNAP QHora-301W (${{ steps.tag.outputs.release_date }})
        body: |
          ### QNAP QHora-301W 专属 iStoreOS 固件发布

          **固件特性：**
          - 源码基准：iStoreOS 24.10.4 (Linux 6.6 内核)
          - 目标平台：Qualcomm IPQ8072A (`qualcommax/ipq807x`)
          - 内核安全适配：精简内建驱动至模块化，防止原厂 U-Boot `inflate() returned -5` 溢出变砖
          - 网卡适配：内置 Aquantia AQR113C 万兆网卡驱动与固件支持

          **刷机文件说明：**
          - `*sysupgrade.bin`: 适用于在已刷入 OpenWrt/QSDK 系统下的系统升级。
          - `qhora_301w_kernel.bin` & `qhora_301w_rootfs.bin`: 已自动解压提取的底层镜像，供原厂系统 SSH 下 `dd` 到 `mmcblk0p1` 与 `mmcblk0p4`。
          - `*initramfs-uImage.itb`: 用于 TTL/TFTP 模式下的免刷机内存引导救砖固件。
        files: ${{ env.FIRMWARE }}/*
